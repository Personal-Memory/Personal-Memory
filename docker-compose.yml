services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        
        container_name: personal-memory-backend

        ports:
            - "8000:8000"

        env_file:
            - ./backend/.env
        
        depends_on:
            postgres:
                condition: service_healthy
        
        volumes:
            - ./backend:/app
        
    postgres:
        image: postgres:17

        container_name: personal-memory-postgres

        environment:
            POSTGRES_DB: personal_memory
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        
        ports:
            - "5432:5432"
        
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d personal_memory"]
            interval: 5s
            timeout: 5s
            retries: 5
        
        volumes:
            - postgres_data:/var/lib/postgresql/data

    frontend:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: personal-memory-frontend
        ports:
            - "5173:5173"
        volumes:
            - ./web:/app
            - /app/node_modules
        env_file:
            - ./web/.env
        depends_on:
            - backend
           
volumes:
    postgres_data:


